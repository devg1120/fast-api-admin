{% extends "base.html" %}

{% block title %}記事一覧 | 管理画面{% endblock %}

{% block content %}
<div class="d-sm-flex align-items-center justify-content-between mb-4">
    <h1 class="h3 mb-0 text-gray-800">記事一覧</h1>
    <a href="#" class="d-none d-sm-inline-block btn btn-sm btn-primary shadow-sm">
        <i class="fas fa-plus fa-sm text-white-50 me-1"></i> 新規記事作成
    </a>
</div>

<div class="card shadow mb-4">
    <div class="card-body">
        <table class="table table-bordered table-striped">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>タイトル</th>
                    <th>ステータス</th>
                    <th>作成日</th>
                </tr>
            </thead>
            <tbody>
                {% for article in articles %}
                <tr>
                    <td>{{ article.id }}</td>
                    <td><a href="#" class="text-primary fw-bold" style="text-decoration:none;">{{ article.title }}</a></td>
                    <td>
                        <span class="badge {% if article.status == '公開中' %}bg-success{% else %}bg-secondary{% endif %}">
                            {{ article.status }}
                        </span>
                    </td>
                    <td>{{ article.date }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
