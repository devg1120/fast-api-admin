{% extends "base.html" %}

{% block title %}カテゴリ設定 | 管理画面{% endblock %}

{% block content %}
<h1 class="h3 mb-4 text-gray-800">カテゴリ設定</h1>

<div class="row">
    <div class="col-md-6">
        <div class="card shadow mb-4">
            <div class="card-header py-3 bg-white">
                <h6 class="m-0 fw-bold text-primary">登録済みカテゴリ</h6>
            </div>
            <div class="card-body">
                <ul class="list-group">
                    {% for cat in categories %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        {{ cat }}
                        <button class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></button>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}
