{% extends "base.html" %}

{% block content %}
<div class="app-content-header">
  <div class="container-fluid">
    <h3 class="mb-0">ユーザー管理</h3>
  </div>
</div>

<div class="app-content">
  <div class="container-fluid">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">登録ユーザー一覧</h3>
      </div>
      <div class="card-body p-0">
        <!-- Bootstrap 5 の綺麗なテーブル -->
        <table class="table table-striped m-0">
          <thead>
            <tr>
              <th>ID</th>
              <th>名前</th>
              <th>メールアドレス</th>
              <th>権限</th>
            </tr>
          </thead>
          <tbody>
            {% for user in users %}
            <tr>
              <td>{{ user.id }}</td>
              <td>{{ user.name }}</td>
              <td>{{ user.email }}</td>
              <td><span class="badge bg-primary">{{ user.role }}</span></td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
