<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン - チャット</title>
</head>
<body>
    <h2>チャットユーザー名を設定</h2>
    <form action="/login" method="post">
        <label for="username">ユーザー名:</label>
        <input type="text" id="username" name="username" required placeholder="名前を入力してください">
        <button type="submit">チャットに参加する</button>
    </form>
</body>
</html>
